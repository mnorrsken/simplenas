#======================= Global Settings =====================================
[global]
   workgroup = WORKGROUP
   server string = simplenas
   server role = standalone server
   dns proxy = no

   log file = /dev/stdout
   max log size = 50

   pam password change = yes
   map to guest = bad user
   usershare allow guests = yes

   # Ownership and modes, identical to what the WebDAV side writes
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775
   force user = smbuser
   force group = smb
   follow symlinks = yes

   # No printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   strict locking = no
   aio read size = 0
   aio write size = 0

   vfs objects = catia fruit streams_xattr

   # Hide the client droppings and nginx's upload buffer from every share
   veto files = /.apdisk/.DS_Store/.TemporaryItems/.Trashes/.nginx-tmp/desktop.ini/ehthumbs.db/Network Trash Folder/Temporary Items/Thumbs.db/
   delete veto files = yes

   # Security: SMB 2.1 and newer only
   client ipc max protocol = SMB3
   client ipc min protocol = SMB2_10
   client max protocol = SMB3
   client min protocol = SMB2_10
   server max protocol = SMB3
   server min protocol = SMB2_10

   # Apple interop and Time Machine. Cap the backup size with
   # "fruit:time machine max size = 512G" if you need to.
   fruit:delete_empty_adfiles = yes
   fruit:time machine = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes

#======================= Share Definitions ===================================
# entrypoint.sh appends any shares given in SHARE#= below this one.

[storage]
   path = /data
   browsable = yes
   read only = no
   guest ok = yes
