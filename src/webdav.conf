dav_ext_lock_zone zone=webdav:10m;

server {
    listen 8080 default_server;

    root /data;
    autoindex on;

    client_max_body_size 0;

    # Keep the upload buffer on the same filesystem as the share. Otherwise
    # every PUT is written twice (temp file, then a cross-device byte copy into
    # /data) and the copy takes its mode from the umask instead of dav_access.
    client_body_temp_path /data/.nginx-tmp;

    # Written by entrypoint.sh: the auth_basic directives when
    # WEBDAV_USERNAME/WEBDAV_PASSWORD are set, otherwise empty.
    include /etc/nginx/webdav-auth.conf;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
    # 0664 for files, 0775 for directories, matching the create/directory
    # masks smbd uses so both services write identical ownership and modes.
    dav_access user:rw group:rw all:r;
    dav_ext_lock zone=webdav;
    create_full_put_path on;

    location / {
        # macOS and Windows clients send PROPPATCH to set timestamps.
        # ngx_http_dav_module cannot store dead properties, so acknowledge
        # the request instead of returning 405.
        if ($request_method = PROPPATCH) {
            add_header Content-Type 'text/xml';
            return 207 '<?xml version="1.0"?><a:multistatus xmlns:a="DAV:"><a:response><a:propstat><a:status>HTTP/1.1 200 OK</a:status></a:propstat></a:response></a:multistatus>';
        }

        # MKCOL only creates a collection when the URI ends in a slash.
        if ($request_method = MKCOL) {
            rewrite ^(.*[^/])$ $1/;
        }
    }
}
